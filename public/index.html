  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

    content="Portfolio de Kamdine Hassanzadeh, étudiant en BUT3 Informatique (parcours Développement Web & Mobile) à l'IUT Nancy-Charlemagne. Projets, expériences et compétences en développement web." />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Applique le thème enregistré avant le rendu pour éviter le flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        var lang = localStorage.getItem("lang");
        if (lang === "en" || lang === "fr") document.documentElement.setAttribute("lang", lang);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <title>Kamdine Hassanzadeh — Développeur Web & Mobile</title>
</head>

<body>
  <noscript>Vous devez activer JavaScript pour afficher ce site.</noscript>

</body>
